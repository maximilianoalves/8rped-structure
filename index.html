<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma - 8RP&A</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0066cc 0%, #e6f2ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-in;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            animation: slideDown 0.6s ease-out;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .filter-btn {
            padding: 12px 25px;
            background: white;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .filter-btn:active {
            transform: translateY(0);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .days-container {
            display: grid;
            gap: 30px;
        }

        .day-section {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.6s ease-out;
        }

        .day-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            font-size: 1.8em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .events-list {
            padding: 20px;
            display: grid;
            gap: 15px;
        }

        .event-card {
            display: grid;
            grid-template-columns: 120px 1fr 120px;
            gap: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            cursor: pointer;
            align-items: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .event-card:hover {
            background: #eef1ff;
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
        }

        .event-card:active {
            transform: translateX(2px);
        }

        .event-time {
            font-weight: bold;
            font-size: 1.1em;
            color: #667eea;
            text-align: center;
        }

        .event-info {
            flex: 1;
        }

        .event-title {
            font-weight: 600;
            font-size: 1.05em;
            color: #333;
            margin-bottom: 5px;
        }

        .event-details {
            font-size: 0.9em;
            color: #666;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .event-detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .event-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
        }

        .event-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.9em;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .event-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .event-link:active {
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #333;
            margin: 0;
        }

        .modal-time {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #667eea;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #764ba2;
            transform: rotate(90deg);
        }

        .modal-description {
            color: #666;
            line-height: 1.6;
            font-size: 1em;
            margin-bottom: 20px;
        }

        .modal-details {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .modal-detail-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .modal-detail-row:last-child {
            margin-bottom: 0;
        }

        .modal-detail-label {
            font-weight: 600;
            color: #667eea;
        }

        .modal-detail-value {
            color: #333;
        }

        .no-results {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2em;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .search-section {
                flex-direction: column;
                gap: 8px;
            }

            .search-box {
                min-width: 100%;
                padding: 15px;
                font-size: 16px;
            }

            .filter-btn {
                flex: 1;
                padding: 12px 10px;
                font-size: 0.9em;
                min-height: 44px;
            }

            .event-card {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 12px;
            }

            .event-time {
                text-align: left;
                font-size: 1.2em;
                font-weight: bold;
            }

            .event-title {
                font-size: 1.1em;
            }

            .event-details {
                flex-direction: column;
                gap: 8px;
            }

            .event-badge {
                display: block;
                padding: 6px 12px;
                font-size: 0.85em;
            }

            .event-link {

                font-size: 1em;
                min-height: 44px;
                width: 100%;
            }

            .modal-content {
                width: 90%;
                padding: 20px;
                max-height: 85vh;
            }

            .modal-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .modal-header h2 {
                font-size: 1.3em;
                word-break: break-word;
            }

            .modal-time {
                align-self: flex-start;
            }

            .close-btn {
                position: absolute;
                right: 15px;
                top: 15px;
                font-size: 1.8em;
            }

            .modal-detail-row {
                grid-template-columns: 1fr;
                font-size: 0.95em;
                gap: 5px;
            }

            .modal-detail-label {
                font-weight: 700;
                display: block;
            }

            .modal-detail-value {
                display: block;
                margin-top: 5px;
            }

            .day-header {
                padding: 15px;
                font-size: 1.4em;
            }

            .events-list {
                padding: 12px;
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5em;
            }

            header p {
                font-size: 0.95em;
            }

            .search-box {
                padding: 12px;
                font-size: 16px;
            }

            .filter-btn {
                padding: 10px 8px;
                font-size: 0.8em;
                min-height: 40px;
            }

            .event-card {
                padding: 10px;
            }

            .event-time {
                font-size: 1.1em;
            }

            .event-title {
                font-size: 1em;
            }

            .event-detail-item {
                font-size: 0.9em;
            }

            .event-badge {
                padding: 5px 10px;
                font-size: 0.8em;
            }

            .event-link {
                padding: 10px 12px;
                font-size: 0.95em;
                min-height: 40px;
            }

            .modal-content {
                width: 95%;
                padding: 15px;
            }

            .modal-header h2 {
                font-size: 1.1em;
            }

            .modal-description {
                font-size: 0.95em;
            }

            .day-header {
                padding: 12px;
                font-size: 1.2em;
                letter-spacing: 0px;
            }

            .events-list {
                padding: 10px;
                gap: 10px;
            }
        }
    </style>
</head>

        let currentFilter = 'all';
        let allEvents = [];
        let scheduleData = {};
        let isLoading = false;

        // Inicializar dados
        function initializeData(data) {
            allEvents = [];
            Object.entries(data).forEach(([day, events]) => {
                events.forEach(event => {
                    allEvents.push({
                        ...event,
                        day: day.toUpperCase()
                    });
                });
            });
            renderSchedule();
        }

        // Mostrar status de carregamento
        function showLoadingStatus(message) {
            const container = document.getElementById('daysContainer');
            container.innerHTML = `<div class="no-results">⏳ ${message}</div>`;
        }

        // Carregar dados da API do Google Sheets
        async function loadFromGoogleSheets() {
            if (GOOGLE_API_KEY === 'YOUR_API_KEY_HERE') {
                console.warn('⚠️ Google API Key não configurada. Usando dados de fallback.');
                showLoadingStatus('📝 Usando dados de fallback (configure a API Key para dados ao vivo)');
                scheduleData = fallbackScheduleData;
                initializeData(scheduleData);
                return;
            }

            showLoadingStatus('🔄 Carregando dados da planilha...');
            isLoading = true;

            try {
                console.log('🚀 Iniciando carregamento...');
                console.log('📌 Spreadsheet ID:', SPREADSHEET_ID);
                console.log('🔑 API Key:', GOOGLE_API_KEY.substring(0, 10) + '...');

                const loader = new ScheduleDataLoader(SPREADSHEET_ID, GOOGLE_API_KEY);
                const data = await loader.loadWithRetry();

                // Normalizar dados
                scheduleData = {};
                Object.entries(data).forEach(([key, events]) => {
                    scheduleData[key.toUpperCase()] = events;
                });

                console.log('✅ Dados carregados com sucesso!', scheduleData);
                showLoadingStatus('✅ Dados carregados! Atualizando...');
                initializeData(scheduleData);

                // Configurar auto-refresh a cada 5 minutos
                loader.startAutoRefresh((data, error) => {
                    if (error) {
                        console.error('❌ Erro ao atualizar dados:', error);
                    } else if (data) {
                        console.log('🔄 Dados atualizados automaticamente');
                        Object.entries(data).forEach(([key, events]) => {
                            scheduleData[key.toUpperCase()] = events;
                        });
                        initializeData(scheduleData);
                    }
                }, 5);
            } catch (error) {
                console.error('❌ Erro ao carregar dados:', error);
                console.error('Stack:', error.stack);
                showLoadingStatus('❌ Erro ao carregar dados. Usando fallback. Verifique o console (F12)');
                scheduleData = fallbackScheduleData;
                initializeData(scheduleData);
            }

            isLoading = false;
        }

        // Renderizar cronograma
        function renderSchedule(filter = 'all', searchTerm = '') {
            const container = document.getElementById('daysContainer');
            container.innerHTML = '';

            let filteredDays = Object.entries(scheduleData);

            if (filter !== 'all') {
                const filterMap = {
                    'sexta': 'SEXTA-FEIRA',
                    'sabado': 'SÁBADO',
                    'domingo': 'DOMINGO'
                };
                filteredDays = filteredDays.filter(([day]) => day === filterMap[filter]);
            }

            let hasResults = false;

            filteredDays.forEach(([dayName, events]) => {
                const filteredEvents = events.filter(event => {
                    const searchLower = searchTerm.toLowerCase();
                    return (
                        event.momento.toLowerCase().includes(searchLower) ||
                        event.responsavel.toLowerCase().includes(searchLower) ||
                        event.local.toLowerCase().includes(searchLower)
                    );
                });

                if (filteredEvents.length > 0) {
                    hasResults = true;
                    const daySection = document.createElement('div');
                    daySection.className = 'day-section';

                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.textContent = dayName;
                    daySection.appendChild(dayHeader);

                    const eventsList = document.createElement('div');
                    eventsList.className = 'events-list';

                    filteredEvents.forEach((event, index) => {
                        const eventCard = document.createElement('div');
                        eventCard.className = 'event-card';

                        const timeDiv = document.createElement('div');
                        timeDiv.className = 'event-time';
                        timeDiv.textContent = event.hora;

                        const infoDiv = document.createElement('div');
                        infoDiv.className = 'event-info';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'event-title';
                        titleDiv.textContent = event.momento;

                        const detailsDiv = document.createElement('div');
                        detailsDiv.className = 'event-details';

                        if (event.responsavel !== '-') {
                            const respSpan = document.createElement('span');
                            respSpan.className = 'event-detail-item';
                            respSpan.innerHTML = `<span class="event-badge">👤 ${event.responsavel}</span>`;
                            detailsDiv.appendChild(respSpan);
                        }

                        if (event.local !== '-') {
                            const locSpan = document.createElement('span');
                            locSpan.className = 'event-detail-item';
                            locSpan.innerHTML = `<span class="event-badge">📍 ${event.local}</span>`;
                            detailsDiv.appendChild(locSpan);
                        }

                        infoDiv.appendChild(titleDiv);
                        infoDiv.appendChild(detailsDiv);

                        const linkBtn = document.createElement('button');
                        linkBtn.className = 'event-link';
                        linkBtn.textContent = 'Ver Detalhes';
                        linkBtn.onclick = (e) => {
                            e.stopPropagation();
                            openModal(event, dayName);
                        };

                        eventCard.appendChild(timeDiv);
                        eventCard.appendChild(infoDiv);
                        eventCard.appendChild(linkBtn);

                        eventsList.appendChild(eventCard);
                    });

                    daySection.appendChild(eventsList);
                    container.appendChild(daySection);
                }
            });

            if (!hasResults) {
                container.innerHTML = '<div class="no-results">😔 Nenhum evento encontrado com esse critério.</div>';
            }
        }

        // Abrir modal
        function openModal(event, dayName) {
            const modal = document.getElementById('eventModal');
            document.getElementById('modalTitle').textContent = event.momento;
            document.getElementById('modalTime').textContent = event.hora;
            document.getElementById('modalDescription').textContent = loremIpsum;
            document.getElementById('modalResponsavel').textContent = event.responsavel;
            document.getElementById('modalLocal').textContent = event.local;
            document.getElementById('modalDay').textContent = dayName;
            modal.classList.add('show');
        }

        // Fechar modal
        function closeModal() {
            document.getElementById('eventModal').classList.remove('show');
        }

        // Event listeners
        document.getElementById('closeBtn').addEventListener('click', closeModal);
        document.getElementById('eventModal').addEventListener('click', (e) => {
            if (e.target.id === 'eventModal') closeModal();
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderSchedule(currentFilter, e.target.value);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderSchedule(currentFilter, document.getElementById('searchInput').value);
            });
        });

        // Inicialização
        document.getElementById('allBtn').classList.add('active');
        loadFromGoogleSheets();
    </script>
</body>
</html>
